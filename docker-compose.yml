
services:
  react-app:
    build: .
    container_name: my-react-app
    ports:
      - "80:80"   # host 80 → container 80
    environment:
      - PORT=80
      - HOST=0.0.0.0
    volumes:
      - .:/app    # 로컬 코드 변경 → 자동 반영 (hot reload)
      - /app/node_modules
    stdin_open: true
    tty: true
